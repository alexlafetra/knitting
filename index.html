<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js"></script>
  <script language="javascript" type="text/javascript" src="webgl-utils.js"></script>
  <script language="javascript" type="text/javascript" src="Mat4.js"></script>
  <script language="javascript" type="text/javascript" src="fabric.js"></script>
  <script language="javascript" type="text/javascript" src="gl_prototype.js"></script>
  <script language="javascript" type="text/javascript" src="main.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Libertinus+Mono&family=Workbench&display=swap');

    html {
      height: 100%;
      overflow: hidden;
      /* font-family: monospace; */
      font-family: Arial, Helvetica, sans-serif;
      color: rgb(0, 93, 62);
      font-size: 12px;
    }

    body {
      height: 100%;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #target_image {
      border: 1px solid black;
      border-radius: 10px;
      width: fit-content;
      height: fit-content;
    }

    #menu_container {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 10px;
    }

    input {
      width: 50px;
      /* user-select: none; */

    }

    div {
      user-select: none;
    }

    #controls {
      /* display:none; */
      display: flex;
      flex-direction: column;
      width: fit-content;
    }

    #canvas_ui_container {
      display: flex;
    }

    .button {
      width: fit-content;
      height: fit-content;
      min-height: 10px;
      min-width: 10px;
      padding: 10px;
      background-color: var(--color);
      margin: 5px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: 0.05s;
    }

    .image_button {
      cursor: pointer;
      height: fit-content;
      width: 50px;
    }

    .button:hover {
      background-color: transparent;
      outline: 2px solid var(--color);
    }

    .slider_input {
      display: flex;
      flex-direction: column;
      padding: 5px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="menu_container">
    <div id="canvas_ui_container">
      <!-- <div>target curvature:</div>  -->
      <canvas id="target_image" width="200" height="200" onclick="drawOnImage(event)" onmousemove="drawOnImage(event)"
        style="cursor:crosshair;" draggable="false" style="user-select: none;"></canvas>
        <div style = "padding:10px;display:flex;flex-direction: column;">
          <div style="display:flex;flex-direction: row;">
            <div style = "display:flex;flex-direction: column;">
            <img class="image_button" src="crayon.gif" onclick="brush = 'draw'">
            <img class="image_button" src="soap.gif" width="60px" onclick="brush = 'erase'">
          </div>
          <div style="display:flex;flex-direction:row;">
            <div style="display:flex;flex-direction: column;">
              <div class="slider_input">
                brush size
                <input type="range" min="2.0" max="100.0" step="1" value="1.0"
                  oninput="brushSize = parseFloat(event.target.value);">
              </div>
              <div class="slider_input">
                gradient size
                <input type="range" min="1.0" max="100.0" step="1" value="1.0"
                  oninput="blurSize = parseFloat(event.target.value);">
              </div>
              </div>
            </div>
          </div>
          <div style = "display:flex;flex-direction: row;">
            <img class="image_button" src="paint.gif" width="60px" onclick="brush = 'erase'">
            <div style = "display:flex;flex-direction: column;">
            <div class="button" onclick="clearSketchpad()" style="--color:blue;"></div>
            <div class="button" onclick="fillSketchpad([255,255,255])" style="--color:red;"></div>
            </div>
          </div>
      </div>
    </div>
    <!-- <img id = "target_image" width = "200px" height = "200px" onclick = "drawOnImage(event)" onmousemove = "drawOnImage(event)" style = "cursor:crosshair;" draggable = "false" style = "user-select: none;"> -->
    <div id="controls">
      <div class="slider_input">
        damping
        <input type="range" min="0.0001" max="0.99999" step="0.001" value="0.2"
          oninput="damping = parseFloat(event.target.value);">
      </div>
      <div class="slider_input">
        spring stiffness
        <input type="range" min="0.0001" max="10.0" step="0.001" value="0.2"
          oninput="springStiffness = parseFloat(event.target.value);">
      </div>
      <div class="slider_input">
        wind
        <input type="range" min="-0.5" max="0.5" step="0.001" value="0.0"
          oninput="wind.z = parseFloat(event.target.value);">
      </div>
      <div class="slider_input">
        curvature
        <input type="range" min="0.0" max="5.0" step="0.001" value="1.0"
          oninput="expansionScaleFactor = parseFloat(event.target.value);">
      </div>
      <div class="slider_input">
        <div>bend</div>
        x
        <input type="range" min="0.0" max="0.3" step="0.001" value="0.0"
          oninput="bendStiffness.x = parseFloat(event.target.value);">
        y
        <input type="range" min="0.0" max="0.3" step="0.001" value="0.0"
          oninput="bendStiffness.y = parseFloat(event.target.value);">
        diagonal
        <input type="range" min="0.0" max="0.3" step="0.001" value="0.0"
          oninput="bendStiffness.diagonal = parseFloat(event.target.value);">
      </div>
    </div>
  </div>
</body>

</html>
